<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro Múltiplo</title>
  <link href="style.css" rel="stylesheet"></link>
</head>
<body>
  <form id="form" class="js-form">
    <label for="name">
      Nome
      <input
        id="name"
        maxlength="120"
        minlength="3"
        name="name"
        type="text"
        required
        pattern="[A-Za-zÀ-ÿ\s]+"
      >
    </label>
    <br><br>
    <label for="birth-date">
      Data de Nascimento
      <input
        id="birth-date"
        name="birth-date"
        required
        type="date"
        min="1920-01-01"
        max="2024-12-31"
      >
    </label>
    <br><br>
    <button type="submit" id="submitbtn">Salvar</button>
  </form>

  <div id="resultado"></div>
  <button onclick="limparFila()" type="submit" id="cleanbtn">Limpar</button>
  <script src="script.js"></script>
</body>
</html>
